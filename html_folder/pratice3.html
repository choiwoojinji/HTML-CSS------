<body>
    <label>아이디</label>
    <input type="text">    
    <label>비밀번호</label>
    <input type="password">

    
    <h4>취미체크하기</h4>
    <label>프로그래밍</label>
    <input type="checkbox" value="computer">
    
    <label>농구</label>
    <input type="radio" name="sport" value="sport"> <!-- 체크박스 네모체크랑 라디오 동그라미체크가 있습니다 -->
                                                    <!-- id 고유값이고 value 실제로 보낼 값 name 서버로 보낼 값 -->

    <h3>두개중하나만 체크할수있게 설정함</h3>
    <label>사과</label>
    <input type="radio" name="servername1" id="A">

    <label>참외</label>
    <input type="radio" name="servername1" id="B"> <!-- name 동일하게 설정한다면 둘중하나만 선택할수있음 -->

    <h3>첨푸파일, 색상선택 넣게 설정함</h3>
    <label>첨푸파일여기에넣어</label>
    <input type="file">

    <label>색상을 고르시오.</label>
    <input type="color">

    <label>날짜 선택하기</label>
    <input type="date">

    <label>전송하기 취소하기</label>
    <input type="reset">
    
    <label>전송하기submit</label>
    <input type="submit">

    <select> <!-- 태그로 드롭다운 메뉴 만들기 -->
        <option>HTML</option>
        <option>CSS</option>
        <option>JAVASCRIPT</option>
    </select>

    <textarea> 내용을 입력해주세요. </textarea> <!-- 내용을 입력할수있게 만드는것이져 -->

    

</body>
