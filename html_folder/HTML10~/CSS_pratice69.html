<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style69.css">
</head>
<body>
    <h1>BMI 계산기(BMI Calculator) 연습</h1>

    <div class="card">
        <div class="field">
            <label for="heightInput">키 (cm)</label>
            <input type="number" id="heightInput" placeholder="예: 170">
        </div>
        <div class="field">
            <label for="weightInput">몸무게 (kg)</label>
            <input type="number" id="weightInput" placeholder="예: 65">
        </div>
        <button class="calc-btn" id="calcBtn">계산하기</button>

        <div class="result" id="result">
            <span class="bmi-value" id="bmiValue">--</span>
            <span class="bmi-category" id="bmiCategory">키와 몸무게를 입력해주세요</span>
        </div>
    </div>

    <script src="../../pratice69.js"></script>
</body>
</html>
