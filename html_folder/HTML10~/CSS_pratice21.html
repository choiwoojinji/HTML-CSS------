<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../CSS10~/style21.css">
</head>
<body>
    <h1>탭 메뉴 연습</h1>

    <div class="tabs">
        <div class="tab-list" role="tablist">
            <button class="tab-btn active" role="tab" data-target="panel-html">HTML</button>
            <button class="tab-btn" role="tab" data-target="panel-css">CSS</button>
            <button class="tab-btn" role="tab" data-target="panel-js">JS</button>
        </div>

        <section class="tab-panel active" id="panel-html" role="tabpanel">
            <p>HTML은 웹 페이지의 뼈대(구조)를 만듭니다.</p>
        </section>
        <section class="tab-panel" id="panel-css" role="tabpanel">
            <p>CSS는 웹 페이지의 모양(디자인)을 꾸밉니다.</p>
        </section>
        <section class="tab-panel" id="panel-js" role="tabpanel">
            <p>JS는 웹 페이지에 움직임(동작)을 더합니다.</p>
        </section>
    </div>

    <script src="../../pratice21.js"></script>
