<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style58.css">
</head>
<body>
    <h1>가위바위보 게임(Rock Paper Scissors) 연습</h1>

    <div class="rps-app">
        <div class="score-board">
            <div class="score">
                <span class="score-label">나</span>
                <span class="score-value" id="playerScore">0</span>
            </div>
            <div class="score">
                <span class="score-label">컴퓨터</span>
                <span class="score-value" id="computerScore">0</span>
            </div>
        </div>

        <div class="choices">
            <button class="choice-btn" data-choice="rock">✊ 바위</button>
            <button class="choice-btn" data-choice="paper">✋ 보</button>
            <button class="choice-btn" data-choice="scissors">✌️ 가위</button>
        </div>

        <div class="result-board">
            <p class="result-detail" id="resultDetail">버튼을 눌러 게임을 시작하세요.</p>
            <p class="result-message" id="resultMessage"></p>
        </div>

        <button class="reset-btn" id="resetBtn">점수 초기화</button>
    </div>

    <script src="../../pratice58.js"></script>
</body>
</html>
