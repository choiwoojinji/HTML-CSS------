<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style68.css">
</head>
<body>
    <h1>다크 모드 토글(Dark Mode Toggle) 연습</h1>

    <div class="card">
        <div class="card-header">
            <span class="card-title">환경 설정</span>
            <button class="toggle-btn" id="toggleBtn" aria-label="다크 모드 전환">
                <span class="icon sun">☀️</span>
                <span class="icon moon">🌙</span>
                <span class="thumb"></span>
            </button>
        </div>
        <p class="card-desc">버튼을 눌러 라이트/다크 모드를 전환해보세요. 선택한 모드는 새로고침해도 유지됩니다.</p>
        <p class="mode-label" id="modeLabel">현재 모드: 라이트</p>
    </div>

    <script src="../../pratice68.js"></script>
</body>
</html>
