<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style54.css">
</head>
<body>
    <h1>할 일 목록(To-Do List) 연습</h1>

    <div class="todo-app">
        <form id="todoForm" class="todo-form">
            <input type="text" id="todoInput" placeholder="할 일을 입력하세요" autocomplete="off">
            <button type="submit">추가</button>
        </form>

        <ul class="todo-list" id="todoList"></ul>

        <p class="todo-summary" id="todoSummary">할 일 0개 남음</p>
    </div>

    <script src="../../pratice54.js"></script>
</body>
