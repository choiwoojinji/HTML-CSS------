<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style65.css">
</head>
<body>
    <h1>카운트다운 타이머(Countdown Timer) 연습</h1>

    <div class="timer-card">
        <div class="time-display" id="timeDisplay">00:00:10</div>

        <div class="input-group">
            <label for="secondsInput">시작 시간(초)</label>
            <input type="number" id="secondsInput" value="10" min="1" max="3599">
        </div>

        <div class="btn-group">
            <button id="startBtn">시작</button>
            <button id="pauseBtn">일시정지</button>
            <button id="resetBtn">초기화</button>
        </div>

        <p class="status" id="status">대기 중</p>
    </div>

    <script src="../../pratice65.js"></script>
</body>
</html>
