<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style36.css">
</head>
<body>
    <h1>원형 프로그레스 바 연습</h1>

    <div class="progress-wrap">
        <svg class="progress-ring" width="180" height="180">
            <circle class="progress-ring__bg" cx="90" cy="90" r="80" />
            <circle class="progress-ring__fg" cx="90" cy="90" r="80" />
        </svg>
        <div class="progress-label" id="progressLabel">0%</div>
    </div>

    <div class="buttons">
        <button id="decreaseBtn">-10%</button>
        <button id="increaseBtn">+10%</button>
        <button id="resetBtn">초기화</button>
    </div>

    <script src="../../pratice36.js"></script>
</body>
</html>
