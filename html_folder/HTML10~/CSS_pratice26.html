<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style26.css">
</head>
<body>
    <h1>비밀번호 강도 체크 연습</h1>

    <div class="pw-checker">
        <label for="pwInput">비밀번호 입력</label>
        <input type="password" id="pwInput" placeholder="비밀번호를 입력하세요" autocomplete="off">

        <div class="bar">
            <div class="bar-fill" id="barFill"></div>
        </div>
        <p class="level" id="levelText">강도: 없음</p>

        <ul class="rules" id="rules">
            <li id="ruleLength">8자 이상</li>
            <li id="ruleCase">대문자 + 소문자 포함</li>
            <li id="ruleNumber">숫자 포함</li>
            <li id="ruleSpecial">특수문자 포함</li>
        </ul>
    </div>

    <script src="../../pratice26.js"></script>
</body>
</html>
