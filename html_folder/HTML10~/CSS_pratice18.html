<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style18.css">
</head>
<body>
    <h1>회원가입 폼 유효성 검사 연습</h1>

    <form class="signup-form" novalidate>
        <div class="field">
            <label for="username">아이디</label>
            <input type="text" id="username" placeholder="4자 이상 입력">
            <p class="message"></p>
        </div>

        <div class="field">
            <label for="email">이메일</label>
            <input type="text" id="email" placeholder="example@email.com">
            <p class="message"></p>
        </div>

        <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" placeholder="6자 이상 입력">
            <p class="message"></p>
        </div>

        <div class="field">
            <label for="password-confirm">비밀번호 확인</label>
            <input type="password" id="password-confirm" placeholder="비밀번호를 한번 더 입력">
            <p class="message"></p>
        </div>

        <button type="submit">가입하기</button>
    </form>

    <script src="../../pratice18.js"></script>
</body>
</html>
