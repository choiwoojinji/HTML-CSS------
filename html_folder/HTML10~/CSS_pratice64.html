<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style64.css">
</head>
<body>
    <h1>탭 전환(Tab Switcher) 연습</h1>

    <div class="tabs">
        <div class="tab-buttons">
            <button class="tab-btn active" data-tab="html">HTML</button>
            <button class="tab-btn" data-tab="css">CSS</button>
            <button class="tab-btn" data-tab="js">JS</button>
        </div>

        <div class="tab-panels">
            <div class="tab-panel active" id="html">
                <p>HTML은 웹 페이지의 구조를 정의하는 마크업 언어입니다.</p>
            </div>
            <div class="tab-panel" id="css">
                <p>CSS는 웹 페이지의 디자인과 레이아웃을 담당합니다.</p>
            </div>
            <div class="tab-panel" id="js">
                <p>JavaScript는 웹 페이지에 동적인 기능을 더해줍니다.</p>
            </div>
        </div>
    </div>

    <script src="../../pratice64.js"></script>
</body>
</html>
