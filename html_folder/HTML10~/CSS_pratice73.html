<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style73.css">
</head>
<body>
    <h1>타이핑 속도 테스트(Typing Speed Test) 연습</h1>

    <div class="card">
        <p class="sample" id="sample"></p>

        <textarea class="input-box" id="inputBox" rows="3" placeholder="위 문장을 그대로 입력하세요" disabled></textarea>

        <div class="result">
            <div class="result-item">
                <span class="result-label">시간</span>
                <span class="result-value" id="timeValue">0.0초</span>
            </div>
            <div class="result-item">
                <span class="result-label">속도</span>
                <span class="result-value" id="speedValue">0 타/분</span>
            </div>
            <div class="result-item">
                <span class="result-label">정확도</span>
                <span class="result-value" id="accuracyValue">100%</span>
            </div>
        </div>

        <button class="retry-btn" id="retryBtn">다시 시작</button>
    </div>

    <script src="../../pratice73.js"></script>
</body>
</html>
