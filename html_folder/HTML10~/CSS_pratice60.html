<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style60.css">
</head>
<body>
    <h1>아코디언(FAQ) 연습</h1>

    <div class="accordion" id="accordion">
        <div class="accordion-item">
            <button class="accordion-header">
                <span>아코디언이 뭔가요?</span>
                <span class="accordion-icon">▾</span>
            </button>
            <div class="accordion-body">
                <p>클릭하면 내용이 펼쳐지고, 다시 클릭하면 접히는 UI 컴포넌트입니다.</p>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-header">
                <span>어떻게 동작하나요?</span>
                <span class="accordion-icon">▾</span>
            </button>
            <div class="accordion-body">
                <p>버튼을 클릭할 때마다 해당 항목의 max-height 값을 토글해서 열고 닫는 애니메이션을 만듭니다.</p>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-header">
                <span>여러 개를 동시에 열 수 있나요?</span>
                <span class="accordion-icon">▾</span>
            </button>
            <div class="accordion-body">
                <p>네. 이 예제는 각 항목을 독립적으로 열고 닫을 수 있도록 만들었습니다.</p>
            </div>
        </div>
    </div>

    <script src="../../pratice60.js"></script>
</body>
</html>
