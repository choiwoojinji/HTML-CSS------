<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style67.css">
</head>
<body>
    <h1>비밀번호 강도 측정기(Password Strength Meter) 연습</h1>

    <div class="form-card">
        <label for="pwInput">비밀번호 입력</label>
        <input type="password" id="pwInput" placeholder="비밀번호를 입력하세요" autocomplete="off">

        <div class="meter">
            <div class="meter-bar" id="meterBar"></div>
        </div>
        <p class="status" id="status">비밀번호를 입력해보세요</p>

        <ul class="rules">
            <li id="ruleLength">8자 이상</li>
            <li id="ruleCase">대문자 + 소문자 포함</li>
            <li id="ruleNumber">숫자 포함</li>
            <li id="ruleSpecial">특수문자 포함</li>
        </ul>
    </div>

    <script src="../../pratice67.js"></script>
</body>
</html>
