<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style50.css">
</head>
<body>
    <h1>이미지 갤러리 라이트박스(Lightbox) 연습</h1>

    <div class="gallery" id="gallery">
        <img class="thumb" src="../img/summer1.jpg" alt="썸머1">
        <img class="thumb" src="../img/summer2.jpg" alt="썸머2">
        <img class="thumb" src="../img/summer3.jpg" alt="썸머3">
        <img class="thumb" src="../img/blue_car.jpg" alt="파란차">
        <img class="thumb" src="../img/red_car.jpg" alt="빨간차">
    </div>

    <div class="lightbox" id="lightbox">
        <button class="lightbox-close" id="lightboxClose">&times;</button>
        <button class="lightbox-nav lightbox-prev" id="lightboxPrev">&lsaquo;</button>
        <img class="lightbox-image" id="lightboxImage" src="" alt="">
        <button class="lightbox-nav lightbox-next" id="lightboxNext">&rsaquo;</button>
    </div>

    <script src="../../pratice50.js"></script>
</body>
</html>
