<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style30.css">
</head>
<body>
    <h1>비밀번호 강도 체크기</h1>

    <div class="password-box">
        <input type="password" id="passwordInput" placeholder="비밀번호를 입력하세요">

        <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
        </div>

        <p class="strength-text" id="strengthText">강도를 확인해보세요</p>

        <ul class="rule-list">
            <li id="ruleLength">8자 이상</li>
            <li id="ruleUpperLower">영문 대/소문자 포함</li>
            <li id="ruleNumber">숫자 포함</li>
            <li id="ruleSpecial">특수문자 포함</li>
        </ul>
    </div>

    <script src="../../pratice30.js"></script>
</body>
</html>
