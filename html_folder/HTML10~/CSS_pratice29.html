<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style29.css">
</head>
<body>
    <h1>디데이 카운트다운</h1>

    <div class="countdown-box">
        <input type="datetime-local" id="targetDate">
        <button class="start-btn" id="startBtn">카운트다운 시작</button>

        <div class="timer" id="timer">
            <div class="unit">
                <span class="number" id="days">00</span>
                <span class="label">일</span>
            </div>
            <div class="unit">
                <span class="number" id="hours">00</span>
                <span class="label">시간</span>
            </div>
            <div class="unit">
                <span class="number" id="minutes">00</span>
                <span class="label">분</span>
            </div>
            <div class="unit">
                <span class="number" id="seconds">00</span>
                <span class="label">초</span>
            </div>
        </div>

        <p class="message" id="message"></p>
    </div>

    <script src="../../pratice29.js"></script>
</body>
</html>
