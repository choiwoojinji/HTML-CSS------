<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS10~/style59.css">
</head>
<body>
    <h1>할 일 목록(To-Do List) 연습</h1>

    <div class="todo-app">
        <form id="todoForm" class="todo-form">
            <input type="text" id="todoInput" class="todo-input" placeholder="할 일을 입력하세요" />
            <button type="submit" class="add-btn">추가</button>
        </form>

        <ul id="todoList" class="todo-list"></ul>

        <p class="todo-empty" id="todoEmpty">할 일이 없습니다. 위에서 추가해보세요.</p>
    </div>

    <script src="../../pratice59.js"></script>
</body>
</html>
