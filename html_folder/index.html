<!DOCTYPE html> # 웹표준 문서라고 선언
<html lang="ko"> # 글자를 한국어로
    <head> # 자식은 시인성 올리려고 들여쓰기. 안해도 문제없음.
        <meta charset="UTF-8"> # 인코딩값을 UTF-8 
        <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
        <title>Document</title>
    </head> # 자식 --------- HEAD 부분은 웹문서에 필요한 외부파일과 옵션을 설정하는 공간 
    <body> # 자식
    
    </body> # 자식 -------- BODY 부분은 웹 브라우저에 내용을 출력하는 공간 
</html>
